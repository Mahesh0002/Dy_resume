name: Update Resume Stats

on:
  schedule:
    - cron: "0 0 * * 0" # Runs every Sunday at midnight
  workflow_dispatch: # Allows you to click "Run Now" manually

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Update Script
        run: python update_stats.py

      - name: Commit Changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # Check if the file changed before committing
          if [[ -n $(git status -s dynamic_stats.tex) ]]; then
            git add dynamic_stats.tex
            git commit -m "Auto-update resume stats"
            git push
          else
            echo "No changes in stats."
          fi

      - name: Compile LaTeX PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      # --- NEW STEP: Rename file for the download link ---
      - name: Rename PDF
        run: mv main.pdf Mahesh_Resume.pdf

      # --- NEW STEP: Publish to Releases ---
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: live # The tag will always be "live"
          name: Live Resume (Latest) # Title of the release
          files: Mahesh_Resume.pdf
          overwrite: true # Overwrite the old file with the new one
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
